plugins { id 'com.android.application' }

android {
    namespace 'com.aurainsani.hgg'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.aurainsani.hgg'
        minSdk 23
        targetSdk 35
        versionCode 515
        versionName '5.1.5'
    }

    buildTypes {
        release {
            // Signed with the automatically generated Android debug keystore for direct device testing.
            // A private release keystore can be configured later for Play public release.
            signingConfig signingConfigs.debug
        }
    }
}
