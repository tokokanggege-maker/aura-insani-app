plugins { id 'com.android.application' }

android {
    namespace 'com.aurainsani.hgg'
    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.aurainsani.hgg'
        minSdk 23
        targetSdk 35
        versionCode 516
        versionName '5.1.6'
    }

    def releaseKeystore = System.getenv('AURA_KEYSTORE')
    def releasePassword = System.getenv('AURA_KEYSTORE_PASSWORD')

    signingConfigs {
        release {
            if (releaseKeystore && releasePassword) {
                storeFile file(releaseKeystore)
                storePassword releasePassword
                keyAlias 'aura-insani-release'
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystore && releasePassword) {
                signingConfig signingConfigs.release
            }
        }
    }
}
