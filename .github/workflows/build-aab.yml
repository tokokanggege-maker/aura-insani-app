name: Build Aura Insani AAB

on:
  workflow_dispatch:
  push:
    branches: [build-apk]

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release AAB
        working-directory: android
        run: gradle --no-daemon bundleRelease

      - name: Locate AAB
        id: locate
        run: |
          AAB=$(find android -type f -name '*.aab' | head -n 1)
          if [ -z "$AAB" ]; then
            echo 'No AAB found'
            exit 1
          fi
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          echo "Found: $AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Insani-AAB-5.1.5
          path: ${{ steps.locate.outputs.aab }}
          if-no-files-found: error

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Locate APK
        id: locate
        run: |
          APK=$(find android -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'No APK found'
            exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Insani-APK-5.1.5
          path: ${{ steps.locate.outputs.apk }}
          if-no-files-found: error
