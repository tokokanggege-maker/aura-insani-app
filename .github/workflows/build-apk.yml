name: Build Aura Insani APK

on:
  push:
    branches: [ build-apk, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create CI release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore aura-insani-release.keystore \
            -storepass 'AuraInsaniBuild2026' \
            -keypass 'AuraInsaniBuild2026' \
            -alias aura-insani-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname 'CN=Aura Insani, OU=Booking, O=Aura Insani, L=Indonesia, ST=Indonesia, C=ID'
          test -s aura-insani-release.keystore

      - name: Build properly signed release APK
        working-directory: android
        env:
          AURA_KEYSTORE: ${{ github.workspace }}/aura-insani-release.keystore
          AURA_KEYSTORE_PASSWORD: AuraInsaniBuild2026
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK release tidak ditemukan: $APK"
            find android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "APK terverifikasi ditandatangani dengan release key."
          cp "$APK" "dist/Aura-Insani-Booking-5.1.6-release.apk"
          ls -lh dist/Aura-Insani-Booking-5.1.6-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Insani-Booking-5.1.6-release
          path: dist/Aura-Insani-Booking-5.1.6-release.apk
          if-no-files-found: error
