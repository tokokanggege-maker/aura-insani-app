name: Build Aura Insani APK

on:
  push:
    branches: [ build-apk, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Locate and rename release APK
        shell: bash
        run: |
          set -e
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK release tidak ditemukan. Isi folder output:"
            find android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi
          echo "APK ditemukan: $APK"
          cp "$APK" "dist/Aura-Insani-Booking-5.1.0-release.apk"
          ls -lh dist/Aura-Insani-Booking-5.1.0-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Insani-Booking-5.1.0-release
          path: dist/Aura-Insani-Booking-5.1.0-release.apk
          if-no-files-found: error
